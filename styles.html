<style>
  :root {
    --primary: #2D2852;
    --primary-light: #3D3862;
    --accent: #B9E22B;
    --accent-dark: #A8D124;
    --bg-body: #F8FAFC;
    --bg-card: #ffffff;
    --text-main: #0F172A;
    --text-secondary: #64748B;
    --radius-xl: 32px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --shadow-soft: 0 20px 40px rgba(15, 23, 42, 0.04);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.02);
    --shadow-luxury: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    --glass: rgba(255, 255, 255, 0.85);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
  body {
    background-color: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* --- ANIMATIONS --- */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade { animation: fadeInUp 0.6s ease forwards; }

  /* --- LAYOUT --- */
  .app-layout { display: grid; grid-template-columns: 80px 1fr; min-height: 100vh; gap: 0; padding: 16px; transition: var(--transition); }
  .app-layout.expanded { grid-template-columns: 240px 1fr; }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--primary);
    border-radius: var(--radius-xl);
    padding: 32px 0;
    display: flex; flex-direction: column; box-shadow: var(--shadow-luxury);
    position: sticky; top: 16px; height: calc(100vh - 32px);
    overflow: visible;
    z-index: 100;
    transition: var(--transition);
  }
  .sidebar-brand {
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    gap: 4px;
    overflow: hidden;
    white-space: nowrap;
  }
  .brand-text-main {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .brand-text-sub {
    font-size: 16px;
    font-weight: 400;
    color: var(--accent);
    opacity: 0.9;
    letter-spacing: 1px;
  }
  .menu-item {
    padding: 14px 20px;
    border-radius: 20px 0 0 20px;
    font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 16px; margin-bottom: 8px;
    color: rgba(255,255,255,0.5); transition: var(--transition); font-size: 14px;
    position: relative;
    margin-left: 12px;
  }
  .menu-item i { font-size: 20px; min-width: 24px; display: flex; justify-content: center; }
  .menu-item span { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .expanded .menu-item span { opacity: 1; pointer-events: auto; }

  .menu-item:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.05); }
  .menu-item.active {
    background: var(--bg-body);
    color: var(--primary);
    font-weight: 800;
  }
  .menu-item.active::before {
    content: "";
    position: absolute;
    top: -40px;
    right: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    box-shadow: 20px 20px 0 0 var(--bg-body);
    background: transparent;
    pointer-events: none;
    z-index: 101;
  }
  .menu-item.active::after {
    content: "";
    position: absolute;
    bottom: -40px;
    right: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    box-shadow: 20px -20px 0 0 var(--bg-body);
    background: transparent;
    pointer-events: none;
    z-index: 101;
  }
  .sidebar-bottom { margin-top: auto; margin-right: 24px; }
  .logout-btn { color: #ff4d4d !important; margin-bottom: 24px; }
  .logout-btn:hover { background: rgba(255, 77, 77, 0.1) !important; }
  .sidebar-footer { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.3); text-align: center; letter-spacing: 1px; }
  .signature { font-size: 10px; margin-top: 4px; color: rgba(255,255,255,0.2); font-weight: 600; }

  /* --- MAIN CONTENT --- */
  .main-content { padding: 0 24px; }
  .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 16px; }
  .user-info h2 { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--primary); }
  .user-info p { color: var(--text-secondary); margin-top: 2px; font-weight: 600; font-size: 12px; }

  .header-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 4px;
  }

  .badge-month {
    background: white;
    color: var(--primary);
    padding: 8px 16px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(45, 40, 82, 0.05);
    text-transform: capitalize;
  }
  .header-actions { display: flex; align-items: center; gap: 24px; }
  .user-avatar {
    width: 48px; height: 48px; border-radius: 16px; background: #E2E8F0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 2px solid #fff; box-shadow: var(--shadow-card);
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .search-bar {
    background: #fff; padding: 8px 20px; border-radius: 16px; display: flex;
    align-items: center; gap: 10px; box-shadow: var(--shadow-card); width: 240px;
  }
  .search-bar input { border: none; outline: none; font-weight: 600; font-size: 14px; color: var(--primary); width: 100%; }

  /* --- CARDS --- */
  .premium-card {
    background: #fff; border-radius: var(--radius-xl); padding: 20px;
    box-shadow: var(--shadow-card); border: 1px solid rgba(241, 245, 249, 0.6);
    transition: var(--transition);
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-header h3 { font-size: 16px; font-weight: 800; color: var(--primary); }
  .badge { background: #F1F5F9; color: #64748b; padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; }

  /* --- BENTO GRID --- */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .metric-card {
    background: var(--bg-card);
    padding: 16px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    border: 1px solid rgba(0,0,0,0.03);
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; background: rgba(30, 27, 51, 0.05); color: var(--primary);
  }
  .ia-insight {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    background: #F8FAFC;
    padding: 8px 12px;
    border-radius: 10px;
    margin-top: auto;
    border-left: 3px solid var(--accent);
  }
  .icon-box {
    width: 60px; height: 60px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: rgba(45, 40, 82, 0.05); color: var(--primary);
    transition: var(--transition);
  }
  .metric-card:hover .icon-box { background: var(--primary); color: #fff; transform: rotate(-5deg); }
  .metric-info p:first-child { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-info p:last-child { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.8px; }

  /* --- LUXURY PROGRESS --- */
  .bono-hero::after {
    content: ""; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
    background: var(--accent); opacity: 0.05; border-radius: 50%;
  }
  .bono-info-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .bono-label { font-size: 14px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
  .bono-amount { font-size: 32px; font-weight: 900; color: var(--primary); letter-spacing: -1px; line-height: 1; }
  .bono-meta-text { font-size: 16px; font-weight: 700; color: #94a3b8; }
  .progress-container { width: 100%; }
  .progress-track { width: 100%; height: 10px; border-radius: 999px; background: #E2E8F0; overflow: hidden; position: relative; }
  .progress-fill {
    width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark));
    transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 999px;
  }

  .sparkline-container { height: 40px; width: 100%; }

  /* --- CHARTS --- */
  .charts-row { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 16px; margin-bottom: 16px; }
  .chart-container { position: relative; height: 240px; width: 100%; }

  /* --- HISTORY & TABLE ROW --- */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* --- FOLDABLE CARDS --- */
  .foldable-card {
    background: #fff;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    border: 1px solid rgba(0,0,0,0.03);
    overflow: hidden;
    transition: var(--transition);
  }
  .foldable-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .foldable-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
    background: #F8FAFC;
    padding: 0 20px;
  }
  .foldable-card.open .foldable-content {
    max-height: 300px;
    padding: 16px 20px;
    border-top: 1px solid rgba(0,0,0,0.03);
  }
  .btn-detail {
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    background: var(--accent);
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
  }
  .hist-date { font-size: 14px; font-weight: 800; color: var(--primary); text-transform: capitalize; }
  .hist-monto { font-size: 16px; font-weight: 800; color: var(--primary); }
  .status-tag { padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .status-ganado { background: rgba(185, 226, 43, 0.15); color: #7a9c12; }
  .status-pendiente { background: #fef3c7; color: #d97706; }

  /* --- LOGIN --- */
  .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-body); }
  .login-card {
    background: #fff; padding: 56px; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); width: 460px; text-align: center;
  }
  .login-card .input-group { text-align: left; margin-bottom: 20px; }
  .login-card select, .login-card input {
    width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0;
    background: #F8FAFC; outline: none; font-weight: 600; transition: var(--transition);
  }
  .login-card select:focus, .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(45, 40, 82, 0.05); }
  .brand-text { font-size: 36px; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: -1.2px; }
  .subtitle-text { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 32px; }
  .login-card label { font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; display: block; letter-spacing: 0.5px; }
  .footer-version { font-size: 11px; font-weight: 800; color: #cbd5e1; margin-top: 32px; letter-spacing: 1px; }
  .btn-primary {
    width: 100%; background: var(--accent); color: var(--primary); border: none; padding: 20px;
    border-radius: 18px; cursor: pointer; font-weight: 800; font-size: 16px; margin-top: 16px;
    transition: var(--transition); box-shadow: 0 12px 24px rgba(185, 226, 43, 0.25);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 18px 30px rgba(185, 226, 43, 0.35); }

  #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 50px; height: 50px; border: 6px solid #F1F5F9; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1200px) {
    .app-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .charts-row, .bottom-row { grid-template-columns: 1fr; }
  }
</style>
