<style>
  :root {
    --primary: #2D2852;
    --accent: #B9E22B;
    --bg-body: #F8FAFC;
    --bg-card: #ffffff;
    --text-main: #1A1A1A;
    --text-secondary: #64748B;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --shadow-soft: 0 20px 40px rgba(45, 40, 82, 0.05);
    --shadow-card: 0 10px 30px rgba(0,0,0,0.05);
    --shadow-ambient: 0 10px 30px rgba(0,0,0,0.03);
    --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Public Sans', sans-serif; }
  body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

  /* --- ANIMATIONS --- */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade { animation: fadeInUp 0.6s ease forwards; }

  /* --- LAYOUT --- */
  .app-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; gap: 24px; padding: 24px; }

  /* --- SIDEBAR --- */
  .sidebar {
    background: var(--primary); border-radius: var(--radius-xl); padding: 40px 24px;
    display: flex; flex-direction: column; box-shadow: var(--shadow-soft);
    position: sticky; top: 24px; height: calc(100vh - 48px);
  }
  .sidebar-brand { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 40px; letter-spacing: -0.8px; }
  .menu-item {
    padding: 16px 20px; border-radius: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 14px; margin-bottom: 8px;
    color: rgba(255,255,255,0.6); transition: var(--transition); font-size: 14px;
  }
  .menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .menu-item.active {
    background: var(--accent); color: var(--primary); box-shadow: 0 12px 24px rgba(185, 226, 43, 0.2);
  }
  .logout-btn { margin-top: auto; color: #ff4d4d !important; }
  .logout-btn:hover { background: #fff5f5 !important; }
  .sidebar-footer { margin-top: 24px; font-size: 10px; font-weight: 800; color: #cbd5e1; text-align: center; letter-spacing: 1px; }

  /* --- MAIN CONTENT --- */
  .main-content { padding: 8px; }
  .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .user-info h2 { font-size: 38px; font-weight: 800; letter-spacing: -1.2px; color: var(--primary); }
  .user-info p { color: var(--text-secondary); margin-top: 2px; font-weight: 600; font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 24px; }
  .user-avatar {
    width: 48px; height: 48px; border-radius: 16px; background: #E2E8F0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 2px solid #fff; box-shadow: var(--shadow-card);
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .search-bar {
    background: #fff; padding: 12px 24px; border-radius: 20px; display: flex;
    align-items: center; gap: 14px; box-shadow: var(--shadow-card); width: 300px;
  }
  .search-bar input { border: none; outline: none; font-weight: 600; font-size: 14px; color: var(--primary); width: 100%; }

  /* --- CARDS --- */
  .premium-card {
    background: #fff; border-radius: var(--radius-xl); padding: 32px;
    box-shadow: var(--shadow-card); border: 1px solid rgba(241, 245, 249, 0.6);
    transition: var(--transition);
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .card-header h3 { font-size: 19px; font-weight: 800; color: var(--primary); }
  .badge { background: #F1F5F9; color: #64748b; padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; }

  /* --- METRICS --- */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 24px; }
  .metric-card {
    background: #fff; padding: 30px; border-radius: var(--radius-lg);
    display: flex; align-items: center; gap: 20px; box-shadow: var(--shadow-card);
  }
  .icon-box {
    width: 60px; height: 60px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: rgba(45, 40, 82, 0.05); color: var(--primary);
    transition: var(--transition);
  }
  .metric-card:hover .icon-box { background: var(--primary); color: #fff; transform: rotate(-5deg); }
  .metric-info p:first-child { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-info p:last-child { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.8px; }

  /* --- HERO BONO CARD --- */
  .bono-hero {
    background: #fff; padding: 40px; border-radius: var(--radius-xl);
    box-shadow: var(--shadow-card); margin-bottom: 32px;
    display: flex; flex-direction: column; gap: 24px;
    position: relative; overflow: hidden;
  }
  .bono-hero::after {
    content: ""; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
    background: var(--accent); opacity: 0.05; border-radius: 50%;
  }
  .bono-info-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .bono-label { font-size: 14px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
  .bono-amount { font-size: 48px; font-weight: 900; color: var(--primary); letter-spacing: -2px; line-height: 1; }
  .bono-meta-text { font-size: 16px; font-weight: 700; color: #94a3b8; }
  .progress-container { width: 100%; }
  .progress-track { width: 100%; height: 12px; border-radius: 999px; background: #F1F5F9; overflow: hidden; position: relative; }
  .progress-fill {
    width: 0%; height: 100%; background: linear-gradient(90deg, #B9E22B, #2D2852);
    transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 999px;
    box-shadow: 0 0 20px rgba(185, 226, 43, 0.3);
  }

  /* --- CHARTS --- */
  .charts-row { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 24px; margin-bottom: 24px; }
  .chart-container { position: relative; height: 320px; width: 100%; }

  /* --- HISTORY & TABLE ROW --- */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  /* --- COMPACT AUDIT --- */
  .audit-item {
    padding: 16px; border-radius: 18px; background: #F8FAFC; margin-bottom: 12px;
    display: flex; flex-direction: column; gap: 8px; border: 1px solid transparent; transition: var(--transition);
  }
  .audit-item:hover { background: #fff; border-color: var(--accent); transform: scale(1.01); }
  .audit-meta { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; }
  .audit-content { font-size: 14px; font-weight: 800; color: var(--primary); line-height: 1.4; }
  .audit-footer { font-size: 12px; font-weight: 600; color: #64748b; font-style: italic; margin-top: 4px; border-top: 1px dashed #E2E8F0; padding-top: 8px; }

  /* --- BONO HISTORY --- */
  .history-list { display: flex; flex-direction: column; gap: 12px; }
  .history-item {
    padding: 20px; border-radius: 20px; background: #fff; border: 1px solid #F1F5F9;
    display: flex; justify-content: space-between; align-items: center; transition: var(--transition);
  }
  .history-item:hover { border-color: var(--accent); }
  .hist-date { font-size: 14px; font-weight: 800; color: var(--primary); text-transform: capitalize; }
  .hist-monto { font-size: 16px; font-weight: 800; color: var(--primary); }
  .status-tag { padding: 4px 12px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .status-ganado { background: rgba(185, 226, 43, 0.15); color: #7a9c12; }
  .status-pendiente { background: #fef3c7; color: #d97706; }

  /* --- LOGIN --- */
  .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-body); }
  .login-card {
    background: #fff; padding: 56px; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); width: 460px; text-align: center;
  }
  .login-card .input-group { text-align: left; margin-bottom: 20px; }
  .login-card select, .login-card input {
    width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0;
    background: #F8FAFC; outline: none; font-weight: 600; transition: var(--transition);
  }
  .login-card select:focus, .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(45, 40, 82, 0.05); }
  .brand-text { font-size: 36px; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: -1.2px; }
  .subtitle-text { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 32px; }
  .login-card label { font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; display: block; letter-spacing: 0.5px; }
  .footer-version { font-size: 11px; font-weight: 800; color: #cbd5e1; margin-top: 32px; letter-spacing: 1px; }
  .btn-primary {
    width: 100%; background: var(--accent); color: var(--primary); border: none; padding: 20px;
    border-radius: 18px; cursor: pointer; font-weight: 800; font-size: 16px; margin-top: 16px;
    transition: var(--transition); box-shadow: 0 12px 24px rgba(185, 226, 43, 0.25);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 18px 30px rgba(185, 226, 43, 0.35); }

  #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 50px; height: 50px; border: 6px solid #F1F5F9; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1200px) {
    .app-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .charts-row, .bottom-row { grid-template-columns: 1fr; }
  }
</style>
