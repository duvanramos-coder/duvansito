<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #0F172A; /* Dark Slate */
    --accent: #10B981;  /* Emerald Green */
    --bg-body: #F8FAFC;
    --bg-card: #ffffff;
    --text-main: #1E293B;
    --text-secondary: #64748B;
    --radius-xl: 16px;
    --radius-lg: 12px;
    --radius-md: 8px;
    --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    --glass: rgba(255, 255, 255, 0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    background-color: var(--bg-body);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden; /* No scrolling for the main dashboard */
  }

  .app-layout {
    display: grid;
    grid-template-columns: 80px 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* --- SIDEBAR (Slim 80px) --- */
  .sidebar {
    background: var(--primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0;
    gap: 32px;
    z-index: 100;
  }
  .sidebar-brand {
    color: var(--accent);
    font-size: 24px;
    font-weight: 800;
  }
  .menu-item {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .menu-item:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .menu-item.active { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
  .menu-item i { font-size: 20px; }
  .sidebar-bottom { margin-top: auto; }

  /* --- MAIN CONTENT --- */
  .main-content {
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  /* --- HEADER --- */
  .content-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #E2E8F0;
  }
  .breadcrumbs { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .breadcrumbs span { color: var(--text-main); }
  .header-profile { display: flex; align-items: center; gap: 12px; }
  .profile-info { text-align: right; }
  .profile-name { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1; }
  .profile-role { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; }
  .avatar { width: 32px; height: 32px; border-radius: 8px; background: #E2E8F0; overflow: hidden; }

  /* --- KPI GRID (4 Columns) --- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  /* --- COMPACT KPI CARD --- */
  .kpi-card {
    background: var(--bg-card);
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(226, 232, 240, 0.6);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    backdrop-filter: blur(8px);
    background: var(--glass);
  }
  .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kpi-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-main { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 4px; }
  .kpi-value { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; line-height: 1; }
  .kpi-sparkline { width: 60px; height: 30px; }
  .kpi-insight {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(0,0,0,0.03);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- CHARTS ROW --- */
  .charts-row {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0; /* Important for flex child overflow */
  }
  .chart-card {
    background: #fff;
    border-radius: var(--radius-xl);
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    border: 1px solid #E2E8F0;
  }
  .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .chart-title { font-size: 13px; font-weight: 700; color: var(--primary); }
  .chart-canvas-container { flex: 1; position: relative; min-height: 0; }

  /* --- TABLE SECTION --- */
  .data-section {
    background: #fff;
    border-radius: var(--radius-xl);
    padding: 0;
    box-shadow: var(--shadow-card);
    border: 1px solid #E2E8F0;
    overflow: hidden;
    max-height: 250px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 10px 16px; background: #F8FAFC; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; font-size: 10px; border-bottom: 1px solid #E2E8F0; }
  td { padding: 10px 16px; border-bottom: 1px solid #F1F5F9; color: var(--text-main); font-weight: 500; }

  /* --- LOGIN (Compact) --- */
  .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-body); }
  .login-card { background: #fff; padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); width: 360px; }
  .login-card h1 { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
  .login-card p { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
  select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #E2E8F0; background: #F8FAFC; font-weight: 600; outline: none; font-size: 13px; }
  .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
  .btn-primary:hover { opacity: 0.9; }

  #loader { position: fixed; inset: 0; background: #fff; z-index: 9999; display: grid; place-items: center; }
  .spinner { width: 40px; height: 40px; border: 4px solid #F1F5F9; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }
</style>
