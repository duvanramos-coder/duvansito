<style>
  :root {
    --primary: #2D2852;
    --accent: #B9E22B;
    --bg-body: #F8FAFC;
    --bg-card: #ffffff;
    --text-main: #2D2852;
    --text-secondary: #8A8D93;
    --radius-xl: 32px;
    --radius-lg: 20px;
    --shadow-soft: 0 18px 50px rgba(45, 40, 82, 0.05);
    --shadow-card: 0 10px 28px rgba(45, 40, 82, 0.04);
    --transition: all 0.3s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Public Sans", sans-serif; }
  body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; overflow-x: hidden; }

  /* --- LAYOUT --- */
  .app-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; gap: 24px; padding: 24px; }

  /* --- SIDEBAR --- */
  .sidebar {
    background: #fff;
    border-radius: var(--radius-xl);
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-soft);
    position: sticky;
    top: 24px;
    height: calc(100vh - 48px);
  }
  .sidebar-brand { font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 40px; letter-spacing: -0.5px; }
  .menu-item {
    padding: 16px 20px;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    color: var(--text-secondary);
    transition: var(--transition);
    font-size: 14px;
  }
  .menu-item:hover { background: #f3f5fb; color: var(--primary); }
  .menu-item.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 10px 20px rgba(45, 40, 82, 0.15);
  }
  .sidebar-upgrade {
    margin-top: auto;
    background: #F8FAFC;
    padding: 24px;
    border-radius: 24px;
    text-align: center;
    margin-bottom: 24px;
  }
  .sidebar-upgrade p { font-size: 12px; font-weight: 700; color: #6d7390; margin-bottom: 16px; }
  .btn-upgrade {
    width: 100%;
    padding: 12px;
    background: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .sidebar-footer { font-size: 10px; font-weight: 800; color: #cbd5e1; text-align: center; letter-spacing: 1px; }

  /* --- MAIN CONTENT --- */
  .main-content { padding: 8px; }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
  .user-info h2 { font-size: 36px; font-weight: 800; letter-spacing: -1px; color: var(--primary); }
  .user-info p { color: var(--text-secondary); margin-top: 4px; font-weight: 600; font-size: 14px; }
  .search-bar {
    background: #fff;
    padding: 12px 20px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-card);
    width: 300px;
  }
  .search-bar i { color: #cbd5e1; }
  .search-bar input { border: none; outline: none; font-weight: 600; font-size: 14px; color: var(--primary); width: 100%; }

  /* --- CARDS --- */
  .premium-card {
    background: #fff;
    border-radius: var(--radius-xl);
    padding: 32px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(241, 245, 249, 0.5);
  }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .card-header h3 { font-size: 18px; font-weight: 800; color: var(--primary); }
  .badge { background: #F1F5F9; color: #64748b; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; }

  /* --- METRICS --- */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 24px; }
  .metric-card {
    background: #fff;
    padding: 28px;
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: var(--shadow-card);
    transition: var(--transition);
  }
  .metric-card:hover { transform: translateY(-5px); }
  .icon-box {
    width: 56px; height: 56px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    background: #F8FAFC; color: var(--primary);
  }
  .metric-info p:first-child { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .metric-info p:last-child { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

  /* --- CHARTS --- */
  .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  .chart-container { position: relative; height: 300px; width: 100%; }

  /* --- PROGRESS BAR --- */
  .progress-track { margin-top: 16px; width: 100%; height: 12px; border-radius: 999px; background: #F1F5F9; overflow: hidden; }
  .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 999px; }

  /* --- TABLE --- */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  th {
    text-align: left; padding: 20px 24px; font-size: 11px; font-weight: 800;
    color: #94a3b8; border-bottom: 1px solid #F1F5F9; text-transform: uppercase; letter-spacing: 1px;
  }
  td { padding: 20px 24px; border-bottom: 1px solid #F8FAFC; font-size: 14px; font-weight: 600; color: #475569; }
  tr:hover td { background: #F8FAFC; }

  /* --- LOGIN --- */
  .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-body); }
  .login-card {
    background: #fff;
    padding: 48px;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-soft);
    width: 440px;
    text-align: center;
  }
  .brand-text { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 8px; letter-spacing: -1px; }
  .subtitle-text { color: var(--text-secondary); font-weight: 600; margin-bottom: 40px; }
  .input-group { margin-bottom: 24px; text-align: left; }
  .input-group label { font-size: 11px; font-weight: 800; color: #94a3b8; display: block; margin-bottom: 10px; letter-spacing: 0.5px; }
  input, select {
    width: 100%; padding: 16px 20px; border: 2px solid #F1F5F9; border-radius: 16px; outline: none;
    background: #F8FAFC; font-weight: 600; font-size: 14px; transition: var(--transition);
  }
  input:focus, select:focus { border-color: var(--primary); background: #fff; }
  .btn-primary {
    width: 100%; background: var(--accent); color: var(--primary); border: none; padding: 18px;
    border-radius: 16px; cursor: pointer; font-weight: 800; font-size: 15px; margin-top: 16px;
    transition: var(--transition); box-shadow: 0 10px 20px rgba(185, 226, 43, 0.2);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(185, 226, 43, 0.3); }
  .footer-version { margin-top: 40px; font-size: 10px; font-weight: 800; color: #cbd5e1; letter-spacing: 2px; }

  /* --- UTILS --- */
  #loader { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 48px; height: 48px; border: 5px solid #F1F5F9; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1100px) {
    .app-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main-content { padding: 16px; }
    .charts-row { grid-template-columns: 1fr; }
  }
</style>
