<script>
  let chartMain = null;
  let chartPqrsf = null;

  function setLoading(isLoading) {
    var loader = document.getElementById("loader");
    if (!loader) return;
    loader.style.display = isLoading ? "flex" : "none";
  }

  function initUsuarios() {
    google.script.run
      .withSuccessHandler(function(usuarios) {
        var select = document.getElementById("usuario");
        select.innerHTML = '<option value="">Selecciona Usuario</option>';
        (usuarios || []).forEach(function(u) {
          var opt = document.createElement("option");
          opt.value = u;
          opt.textContent = u;
          select.appendChild(opt);
        });
      })
      .obtenerUsuarios();
  }

  function login() {
    var usuario = document.getElementById("usuario").value;
    var password = document.getElementById("password").value;
    if (!usuario || !password) {
      alert("Debes seleccionar usuario y contraseña.");
      return;
    }

    setLoading(true);
    google.script.run
      .withSuccessHandler(function(data) {
        setLoading(false);
        if (data === "ERROR") {
          alert("Usuario o contraseña incorrectos.");
          return;
        }
        renderDashboard(usuario, data);
      })
      .withFailureHandler(function() {
        setLoading(false);
        alert("Error de conexión con Apps Script.");
      })
      .login(usuario, password);
  }

  function logout() {
    document.getElementById("dashboardSection").style.display = "none";
    document.getElementById("loginSection").style.display = "flex";
    document.getElementById("password").value = "";
    if (chartMain) { chartMain.destroy(); chartMain = null; }
    if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
  }

  function renderDashboard(user, data) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("dashboardSection").style.display = "grid";
    document.getElementById("asesorNombre").innerText = "Hola, " + (data.nombre || user);
    document.getElementById("asesorArea").innerText = data.area || "Sin área asignada";

    const grid = document.getElementById("metricGrid");
    grid.innerHTML = "";

    const icons = {
      "PEC": "fa-star",
      "PENC": "fa-check-double",
      "Satisfacción": "fa-heart",
      "Productividad": "fa-bolt",
      "Adherencia": "fa-clock",
      "Auditorías": "fa-magnifying-glass-chart",
      "PQRSF Creados": "fa-file-circle-plus",
      "PQRSF Devueltos": "fa-file-circle-xmark"
    };

    (data.metrics || []).forEach((m) => {
      const icon = icons[m.label] || "fa-chart-line";
      const card = document.createElement("div");
      card.className = "metric-card";
      card.innerHTML = `
        <div class="icon-box">
          <i class="fa-solid ${icon}"></i>
        </div>
        <div class="metric-info">
          <p>${m.label}</p>
          <p>${m.value}</p>
        </div>`;
      grid.appendChild(card);
    });

    renderCharts(data);
    renderTable(data.tablaData || []);
    updateProgressBar(data);
  }

  function extractNumericPercent(value) {
    if (typeof value === "number") {
      return value > 1 ? value : value * 100;
    }
    const cleaned = String(value || "").replace(",", ".").replace(/[^\d.]/g, "");
    return Number(cleaned) || 0;
  }

  function renderCharts(data) {
    const labels = [];
    const values = [];
    (data.metrics || []).forEach(function(m) {
      if (String(m.value).includes("%")) {
        labels.push(m.label);
        values.push(extractNumericPercent(m.value));
      }
    });

    if (chartMain) chartMain.destroy();
    const ctxMain = document.getElementById("chartMain");
    chartMain = new Chart(ctxMain, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            data: labels.map(() => 100),
            backgroundColor: '#F1F5F9',
            borderRadius: 12,
            barThickness: 24,
          },
          {
            data: values,
            backgroundColor: (c) => c.dataIndex === 0 || c.dataIndex === 3 ? '#2D2852' : '#B9E22B',
            borderRadius: 12,
            barThickness: 24,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { display: false, beginAtZero: true, max: 100 },
          x: {
            grid: { display: false },
            ticks: { font: { weight: '700', size: 10 }, color: '#94a3b8' }
          }
        }
      }
    });

    const pqrsfCre = (data.metrics || []).find((m) => m.label === "PQRSF Creados");
    const pqrsfDev = (data.metrics || []).find((m) => m.label === "PQRSF Devueltos");
    const chartPqrsfBox = document.getElementById("chartPqrsfBox");
    if (pqrsfCre || pqrsfDev) {
      chartPqrsfBox.style.display = "block";
      if (chartPqrsf) chartPqrsf.destroy();
      chartPqrsf = new Chart(document.getElementById("chartPqrsf"), {
        type: "doughnut",
        data: {
          labels: ["Creados", "Devueltos"],
          datasets: [{
            data: [Number(pqrsfCre?.value || 0), Number(pqrsfDev?.value || 0)],
            backgroundColor: ["#B9E22B", "#2D2852"],
            borderWidth: 0,
            cutout: '75%'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { weight: '700' } } } }
        }
      });
    } else {
      chartPqrsfBox.style.display = "none";
      if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
    }
  }

  function renderTable(tablaData) {
    const tableBox = document.getElementById("tableBox");
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    if (!tablaData.length) {
      tableBox.style.display = "none";
      return;
    }

    tableBox.style.display = "block";
    tablaData.forEach(function(item) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.fecha || ""}</td>
        <td>${item.mes || ""}</td>
        <td><span class="badge" style="background:#f3f5fb; color:#2D2852">${item.idGestion || ""}</span></td>
        <td>${item.canal || ""}</td>
        <td>${item.tipoGestion || ""}</td>
        <td style="font-weight:800">${item.evaluador || ""}</td>
        <td style="color:#64748b; font-size:12px">${item.puntosMejora || ""}</td>`;
      tbody.appendChild(tr);
    });
  }

  function updateProgressBar(data) {
    const barra = document.getElementById("barraProgreso");
    const label = document.getElementById("labelEstado");
    const bono = Number(data.bonoGanado || 0);
    const meta = 150000;
    const pct = Math.max(0, Math.min(100, (bono / meta) * 100));

    barra.style.width = pct + "%";
    label.innerHTML = `<strong>$${bono.toLocaleString("es-CO")}</strong> / $${meta.toLocaleString("es-CO")}`;
  }

  document.addEventListener("DOMContentLoaded", function() {
    initUsuarios();
  });
</script>
