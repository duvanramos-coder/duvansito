<script>
  let chartMain = null;
  let chartPqrsf = null;

  // Registrar plugin de etiquetas de datos
  Chart.register(ChartDataLabels);

  function setLoading(isLoading) {
    var loader = document.getElementById("loader");
    if (!loader) return;
    loader.style.opacity = isLoading ? "1" : "0";
    setTimeout(() => { loader.style.display = isLoading ? "flex" : "none"; }, 300);
  }

  function initUsuarios() {
    google.script.run
      .withSuccessHandler(function(usuarios) {
        var select = document.getElementById("usuario");
        select.innerHTML = '<option value="">Selecciona Usuario</option>';
        (usuarios || []).forEach(function(u) {
          var opt = document.createElement("option");
          opt.value = u;
          opt.textContent = u;
          select.appendChild(opt);
        });
        setLoading(false);
      })
      .obtenerUsuarios();
  }

  function login() {
    var usuario = document.getElementById("usuario").value;
    var password = document.getElementById("password").value;
    if (!usuario || !password) {
      alert("Debes seleccionar usuario y contraseña.");
      return;
    }

    setLoading(true);
    google.script.run
      .withSuccessHandler(function(data) {
        setLoading(false);
        if (data === "ERROR") {
          alert("Usuario o contraseña incorrectos.");
          return;
        }
        renderDashboard(usuario, data);
      })
      .withFailureHandler(function() {
        setLoading(false);
        alert("Error de conexión con Apps Script.");
      })
      .login(usuario, password);
  }

  function logout() {
    document.getElementById("dashboardSection").style.display = "none";
    document.getElementById("loginSection").style.display = "flex";
    document.getElementById("password").value = "";
    if (chartMain) { chartMain.destroy(); chartMain = null; }
    if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
  }

  function renderDashboard(user, data) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("dashboardSection").style.display = "grid";
    document.getElementById("asesorNombre").innerText = "Hola, " + (data.nombre || user);
    document.getElementById("asesorArea").innerText = data.area || "Sin área asignada";

    // Render Current Month
    const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
    const mesActual = meses[new Date().getMonth()];
    document.getElementById("currentMonth").innerText = "Mes " + mesActual;

    const avatarImg = document.getElementById("userAvatarImg");
    if (avatarImg) {
      avatarImg.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(data.nombre || user) + "&background=B9E22B&color=2D2852&bold=true";
    }

    const grid = document.getElementById("metricGrid");
    grid.innerHTML = "";

    const icons = {
      "PEC": "ph-star",
      "PENC": "ph-check-circle",
      "Satisfacción": "ph-heart",
      "Productividad": "ph-lightning",
      "Adherencia": "ph-timer",
      "Auditorías": "ph-magnifying-glass",
      "PQRSF Creados": "ph-file-plus",
      "PQRSF Devueltos": "ph-file-x"
    };

    (data.metrics || []).forEach((m) => {
      const iconClass = icons[m.label] || "ph-chart-line";
      const card = document.createElement("div");
      card.className = "metric-card";
      card.innerHTML = `
        <div class="icon-box"><i class="ph-bold ${iconClass}"></i></div>
        <div class="metric-info">
          <p>${m.label}</p>
          <p>${m.value}</p>
        </div>`;
      grid.appendChild(card);
    });

    try { renderCharts(data); } catch(e) { console.error("Error charts:", e); }
    try { renderTable(data.tablaData || []); } catch(e) { console.error("Error table:", e); }
    try { renderHistory(data.historialBono || []); } catch(e) { console.error("Error history:", e); }
    try { updateProgressBar(data); } catch(e) { console.error("Error progress:", e); }
  }

  function extractNumericPercent(value) {
    if (typeof value === "number") {
      return value > 1 ? value : value * 100;
    }
    const cleaned = String(value || "").replace(",", ".").replace(/[^\d.]/g, "");
    return Number(cleaned) || 0;
  }

  function renderCharts(data) {
    const labels = [];
    const values = [];
    (data.metrics || []).forEach(function(m) {
      if (String(m.value).includes("%")) {
        labels.push(m.label);
        values.push(extractNumericPercent(m.value));
      }
    });

    if (chartMain) chartMain.destroy();
    const ctxMain = document.getElementById("chartMain");
    chartMain = new Chart(ctxMain, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            data: labels.map(() => 100),
            backgroundColor: '#F1F5F9',
            borderRadius: 12,
            barThickness: 28,
            datalabels: { display: false }
          },
          {
            data: values,
            backgroundColor: (c) => {
              const ctx = c.chart.ctx;
              const gradient = ctx.createLinearGradient(0, 0, 0, 400);
              if (c.dataIndex === 0 || c.dataIndex === 3) {
                gradient.addColorStop(0, '#2D2852');
                gradient.addColorStop(1, '#1A1A1A');
              } else {
                gradient.addColorStop(0, '#B9E22B');
                gradient.addColorStop(1, '#9bc220');
              }
              return gradient;
            },
            borderRadius: 12,
            barThickness: 28
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'top',
            color: '#2D2852',
            font: { weight: '800', size: 10 },
            formatter: (v) => v + "%"
          }
        },
        scales: {
          y: { display: false, beginAtZero: true, max: 120 },
          x: {
            grid: { display: false },
            ticks: { font: { weight: '700', size: 11 }, color: '#94a3b8' }
          }
        }
      }
    });

    const pqrsfCre = (data.metrics || []).find((m) => m.label === "PQRSF Creados");
    const pqrsfDev = (data.metrics || []).find((m) => m.label === "PQRSF Devueltos");
    const chartPqrsfBox = document.getElementById("chartPqrsfBox");
    if (pqrsfCre || pqrsfDev) {
      chartPqrsfBox.style.display = "block";
      if (chartPqrsf) chartPqrsf.destroy();
      chartPqrsf = new Chart(document.getElementById("chartPqrsf"), {
        type: "doughnut",
        data: {
          labels: ["Creados", "Devueltos"],
          datasets: [{
            data: [Number(pqrsfCre?.value || 0), Number(pqrsfDev?.value || 0)],
            backgroundColor: ["#B9E22B", "#2D2852"],
            borderWidth: 0,
            cutout: '80%'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { weight: '800', size: 12 }, color: '#2D2852', usePointStyle: true, padding: 20 } },
            datalabels: {
              color: (c) => c.dataIndex === 0 ? '#2D2852' : '#fff',
              font: { weight: '900', size: 13 },
              formatter: (v) => v
            }
          }
        }
      });
    } else {
      chartPqrsfBox.style.display = "none";
      if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
    }
  }

  function renderTable(tablaData) {
    const auditContainer = document.getElementById("auditCompactList");
    auditContainer.innerHTML = "";

    if (!tablaData.length) {
      auditContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#94a3b8; font-weight:700">No hay auditorías recientes.</p>';
      return;
    }

    tablaData.slice(0, 5).forEach(item => {
      const div = document.createElement("div");
      div.className = "audit-item";
      div.innerHTML = `
        <div class="audit-meta">
          <span>${item.fecha}</span>
          <span class="badge" style="background:#fff; color:var(--primary)">${item.canal}</span>
        </div>
        <div class="audit-content">${item.tipoGestion} - ID: ${item.idGestion}</div>
        <div class="audit-footer">${item.puntosMejora || "Sin puntos de mejora registrados."}</div>
      `;
      auditContainer.appendChild(div);
    });
  }

  function renderHistory(history) {
    const list = document.getElementById("bonoHistoryList");
    list.innerHTML = "";

    if (!history || !history.length) {
      list.innerHTML = '<p style="text-align:center; padding:40px; color:#94a3b8; font-weight:700">Sin historial de bonos.</p>';
      return;
    }

    history.forEach(item => {
      const status = (item.estado || "").toString().toLowerCase();
      const statusClass = status === "ganado" ? "status-ganado" : "status-pendiente";
      const div = document.createElement("div");
      div.className = "history-item";
      div.innerHTML = `
        <div class="hist-date">${item.fecha}</div>
        <div style="display:flex; align-items:center; gap:16px">
          <div class="hist-monto">$${Number(item.monto).toLocaleString("es-CO")}</div>
          <div class="status-tag ${statusClass}">${item.estado}</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function updateProgressBar(data) {
    const barra = document.getElementById("barraProgreso");
    const amountText = document.getElementById("bonoAmountText");
    const metaLabel = document.getElementById("bonoMetaLabel");
    const bono = Number(data.bonoGanado || 0);
    const meta = 300000;
    const pct = Math.max(0, Math.min(100, (bono / meta) * 100));

    if (barra) {
      // Force a small delay to ensure DOM is ready and transition works
      setTimeout(() => {
        barra.style.width = pct + "%";
      }, 100);
    }
    if (amountText) amountText.innerText = `$${bono.toLocaleString("es-CO")}`;
    if (metaLabel) metaLabel.innerText = `Meta: $${meta.toLocaleString("es-CO")}`;
  }

  document.addEventListener("DOMContentLoaded", function() {
    initUsuarios();
  });
</script>
