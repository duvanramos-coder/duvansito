<script>
  let chartMain = null;
  let chartPqrsf = null;

  // Registrar plugin de etiquetas de datos
  Chart.register(ChartDataLabels);

  function setLoading(isLoading) {
    var loader = document.getElementById("loader");
    if (!loader) return;
    loader.style.opacity = isLoading ? "1" : "0";
    setTimeout(() => { loader.style.display = isLoading ? "flex" : "none"; }, 300);
  }

  function initUsuarios() {
    google.script.run
      .withSuccessHandler(function(usuarios) {
        var select = document.getElementById("usuario");
        select.innerHTML = '<option value="">Selecciona Usuario</option>';
        (usuarios || []).forEach(function(u) {
          var opt = document.createElement("option");
          opt.value = u;
          opt.textContent = u;
          select.appendChild(opt);
        });
        setLoading(false);
      })
      .obtenerUsuarios();
  }

  function login() {
    var usuario = document.getElementById("usuario").value;
    var password = document.getElementById("password").value;
    if (!usuario || !password) {
      alert("Debes seleccionar usuario y contraseña.");
      return;
    }

    setLoading(true);
    google.script.run
      .withSuccessHandler(function(data) {
        setLoading(false);
        if (data === "ERROR") {
          alert("Usuario o contraseña incorrectos.");
          return;
        }
        renderDashboard(usuario, data);
      })
      .withFailureHandler(function() {
        setLoading(false);
        alert("Error de conexión con Apps Script.");
      })
      .login(usuario, password);
  }

  function logout() {
    document.getElementById("dashboardSection").style.display = "none";
    document.getElementById("loginSection").style.display = "flex";
    document.getElementById("password").value = "";
    if (chartMain) { chartMain.destroy(); chartMain = null; }
    if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
  }

  function renderDashboard(user, data) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("dashboardSection").style.display = "grid";
    document.getElementById("asesorNombre").innerText = (data.nombre || user);

    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const d = new Date();
    document.getElementById("currentMonthFull").innerText = meses[d.getMonth()] + " " + d.getFullYear();

    const avatarImg = document.getElementById("userAvatarImg");
    if (avatarImg) {
      avatarImg.src = "https://ui-avatars.com/api/?name=" + encodeURIComponent(data.nombre || user) + "&background=B9E22B&color=2D2852&bold=true";
    }

    renderMetricGrid(data);

    try { renderCharts(data); } catch(e) { console.error("Error charts:", e); }
    try { renderTable(data.tablaData || []); } catch(e) { console.error("Error table:", e); }
    try { renderHistory(data.historialBono || []); } catch(e) { console.error("Error history:", e); }
    try { updateProgressBar(data); } catch(e) { console.error("Error progress:", e); }
  }

  function renderMetricGrid(data) {
    const grid = document.getElementById("metricGrid");
    grid.innerHTML = "";

    const icons = {
      "Satisfacción": "ph-heart",
      "PEC": "ph-star",
      "Adherencia": "ph-timer",
      "Productividad": "ph-lightning",
      "Auditorías": "ph-magnifying-glass",
      "PQRSF Creados": "ph-file-plus",
      "PQRSF Devueltos": "ph-file-x"
    };

    // Card de Bono (Siempre primero)
    const bonoCard = document.createElement("div");
    bonoCard.className = "metric-card";
    bonoCard.innerHTML = `
      <div class="card-top">
        <p style="font-size: 11px; font-weight: 700; color: var(--text-secondary);">Bono del Mes Actual</p>
        <div class="card-icon"><i class="ph ph-money"></i></div>
      </div>
      <div>
        <h1 id="bonoAmountText" style="font-size: 24px; margin-bottom: 8px;">$0</h1>
        <div class="progress-track"><div class="progress-fill" id="barraProgreso"></div></div>
        <p id="bonoMetaLabel" style="font-size: 10px; color: #94a3b8; margin-top: 6px; font-weight: 700;">Meta: $300.000</p>
      </div>
      <div class="sparkline-container"><canvas id="sparkline-bono"></canvas></div>
      <div class="ia-insight">${getIAInsight("Bono", data.bonoGanado)}</div>
    `;
    grid.appendChild(bonoCard);
    renderSparkline("sparkline-bono");

    // Cards dinámicas
    (data.metrics || []).forEach(m => {
      const iconClass = icons[m.label] || "ph-chart-line-up";
      const card = document.createElement("div");
      card.className = "metric-card";
      const sparkId = "spark-" + m.label.replace(/\s+/g, '-').toLowerCase();

      card.innerHTML = `
        <div class="card-top">
          <p style="font-size: 11px; font-weight: 700; color: var(--text-secondary);">${m.label}</p>
          <div class="card-icon"><i class="ph ${iconClass}"></i></div>
        </div>
        <h1 style="font-size: 24px;">${m.value}</h1>
        <div class="sparkline-container"><canvas id="${sparkId}"></canvas></div>
        <div class="ia-insight">${getIAInsight(m.label, m.value)}</div>
      `;
      grid.appendChild(card);
      renderSparkline(sparkId);
    });
  }

  function getIAInsight(label, value) {
    const val = extractNumericPercent(value);
    if (label === "Bono") {
      const meta = 300000;
      const pct = (val / meta) * 100;
      if (pct >= 100) return "¡Felicidades! Has alcanzado la meta máxima de bono.";
      if (pct >= 80) return "Casi allí. Estás al " + pct.toFixed(0) + "% de tu meta.";
      return "Sigue así. Tu bono actual es de $" + val.toLocaleString("es-CO");
    }
    if (label === "PEC" || label === "Satisfacción") {
      if (val >= 95) return "Rendimiento excelente. Mantén este estándar.";
      if (val >= 90) return "Buen trabajo. Superas el objetivo mínimo.";
      return "Oportunidad de mejora detectada. Revisa los puntos clave.";
    }
    if (label === "Adherencia") {
      if (val >= 92) return "Gran disciplina. Tu adherencia es óptima.";
      return "Se detectan desviaciones en tiempos. Ajusta tu conexión.";
    }
    return "Métrica estable dentro de los parámetros esperados.";
  }

  function renderSparkline(canvasId) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: [1,2,3,4,5,6,7],
        datasets: [{
          data: Array.from({length: 7}, () => Math.floor(Math.random() * 20) + 10),
          borderColor: '#B9E22B',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          backgroundColor: 'rgba(185, 226, 43, 0.05)',
          tension: 0.4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, datalabels: { display: false } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  }

  function extractNumericPercent(value) {
    if (typeof value === "number") {
      return value > 1 ? value : value * 100;
    }
    const cleaned = String(value || "").replace(",", ".").replace(/[^\d.]/g, "");
    return Number(cleaned) || 0;
  }

  function renderCharts(data) {
    const labels = [];
    const values = [];
    (data.metrics || []).forEach(function(m) {
      if (String(m.value).includes("%")) {
        labels.push(m.label);
        values.push(extractNumericPercent(m.value));
      }
    });

    if (chartMain) chartMain.destroy();
    const ctxMain = document.getElementById("chartMain");
    chartMain = new Chart(ctxMain, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [
          {
            data: labels.map(() => 100),
            backgroundColor: '#F1F5F9',
            borderRadius: 12,
            barThickness: 28,
            datalabels: { display: false }
          },
          {
            data: values,
            backgroundColor: (c) => {
              const ctx = c.chart.ctx;
              const gradient = ctx.createLinearGradient(0, 0, 0, 400);
              if (c.dataIndex === 0 || c.dataIndex === 3) {
                gradient.addColorStop(0, '#2D2852');
                gradient.addColorStop(1, '#1A1A1A');
              } else {
                gradient.addColorStop(0, '#B9E22B');
                gradient.addColorStop(1, '#9bc220');
              }
              return gradient;
            },
            borderRadius: 12,
            barThickness: 28
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'end',
            align: 'top',
            color: '#2D2852',
            font: { weight: '800', size: 10 },
            formatter: (v) => v + "%"
          }
        },
        scales: {
          y: { display: false, beginAtZero: true, max: 120 },
          x: {
            grid: { display: false },
            ticks: { font: { weight: '700', size: 11 }, color: '#94a3b8' }
          }
        }
      }
    });

    const pqrsfCre = (data.metrics || []).find((m) => m.label === "PQRSF Creados");
    const pqrsfDev = (data.metrics || []).find((m) => m.label === "PQRSF Devueltos");
    const chartPqrsfBox = document.getElementById("chartPqrsfBox");
    if (pqrsfCre || pqrsfDev) {
      chartPqrsfBox.style.display = "block";
      if (chartPqrsf) chartPqrsf.destroy();
      chartPqrsf = new Chart(document.getElementById("chartPqrsf"), {
        type: "doughnut",
        data: {
          labels: ["Creados", "Devueltos"],
          datasets: [{
            data: [Number(pqrsfCre?.value || 0), Number(pqrsfDev?.value || 0)],
            backgroundColor: ["#B9E22B", "#2D2852"],
            borderWidth: 0,
            cutout: '80%'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { font: { weight: '800', size: 12 }, color: '#2D2852', usePointStyle: true, padding: 20 } },
            datalabels: {
              color: (c) => c.dataIndex === 0 ? '#2D2852' : '#fff',
              font: { weight: '900', size: 13 },
              formatter: (v) => v
            }
          }
        }
      });
    } else {
      chartPqrsfBox.style.display = "none";
      if (chartPqrsf) { chartPqrsf.destroy(); chartPqrsf = null; }
    }
  }

  function renderTable(tablaData) {
    const auditContainer = document.getElementById("auditCompactList");
    auditContainer.innerHTML = "";

    if (!tablaData.length) {
      auditContainer.innerHTML = '<p style="text-align:center; padding:40px; color:#94a3b8; font-weight:700">No hay auditorías.</p>';
      return;
    }

    tablaData.slice(0, 5).forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "foldable-card";
      div.innerHTML = `
        <div class="foldable-header" onclick="toggleFoldable(this)">
          <div style="display:flex; align-items:center; gap:12px">
            <i class="ph ph-file-text" style="color:var(--primary)"></i>
            <span style="font-weight:700; font-size:13px">${item.idGestion}</span>
          </div>
          <button class="btn-detail">Ver Detalles</button>
        </div>
        <div class="foldable-content">
          <p style="font-size:12px; color:var(--text-secondary); margin-bottom:8px"><strong>Fecha:</strong> ${item.fecha}</p>
          <p style="font-size:12px; font-weight:600">IA Analysis: Tono detectado neutral. El proceso fue completado satisfactoriamente según los lineamientos de calidad.</p>
        </div>
      `;
      auditContainer.appendChild(div);
    });
  }

  function renderHistory(history) {
    const list = document.getElementById("bonoHistoryList");
    list.innerHTML = "";

    if (!history || !history.length) {
      list.innerHTML = '<p style="text-align:center; padding:40px; color:#94a3b8; font-weight:700">Sin historial.</p>';
      return;
    }

    history.forEach(item => {
      const status = (item.estado || "").toString().toLowerCase();
      const statusClass = status === "ganado" ? "status-ganado" : "status-pendiente";
      const div = document.createElement("div");
      div.className = "foldable-card";
      div.innerHTML = `
        <div class="foldable-header" onclick="toggleFoldable(this)">
          <div style="display:flex; align-items:center; gap:12px">
            <i class="ph ph-coins" style="color:var(--primary)"></i>
            <span style="font-weight:700; font-size:13px">${item.fecha}</span>
          </div>
          <div class="status-tag ${statusClass}">${item.estado}</div>
        </div>
        <div class="foldable-content">
          <p style="font-size:14px; font-weight:800; color:var(--primary)">Monto: $${Number(item.monto).toLocaleString("es-CO")}</p>
          <button class="btn-detail" style="margin-top:10px">Detalles de Cálculo</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function toggleFoldable(header) {
    const card = header.parentElement;
    card.classList.toggle('open');
  }

  function updateProgressBar(data) {
    const barra = document.getElementById("barraProgreso");
    const amountText = document.getElementById("bonoAmountText");
    const metaLabel = document.getElementById("bonoMetaLabel");
    const bono = Number(data.bonoGanado || 0);
    const meta = 300000;
    const pct = Math.max(0, Math.min(100, (bono / meta) * 100));

    if (barra) {
      // Force a small delay to ensure DOM is ready and transition works
      setTimeout(() => {
        barra.style.width = pct + "%";
      }, 100);
    }
    if (amountText) amountText.innerText = `$${bono.toLocaleString("es-CO")}`;
    if (metaLabel) metaLabel.innerText = `Meta: $${meta.toLocaleString("es-CO")}`;
  }

  document.addEventListener("DOMContentLoaded", function() {
    initUsuarios();
  });
</script>
